version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot_dev
      POSTGRES_DB: leadpilot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadpilot']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
