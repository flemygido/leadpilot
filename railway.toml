[build]
builder = "nixpacks"
buildCommand = "npm install && npx prisma generate --schema=packages/db/prisma/schema.prisma && npm run build --workspace=packages/db && npm run build --workspace=packages/core && npm run build --workspace=apps/api"

[deploy]
startCommand = "node apps/api/dist/index.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
